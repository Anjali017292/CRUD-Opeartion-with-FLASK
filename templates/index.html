{% extends './base.html' %}
{% block title %} Home {% endblock %}

{% block content %}
    
    <div class="container mt-5">
        <div class="row">
            <div class="col">
                <div class="alert alert-primary">
                    <h2 class="text-center">All Contact Records</h2>
                </div>

                <table class="table table-hover">
                    <tr>
                        <th>ID</th>
                        <th>NAME</th>
                        <th>EMAIL</th>
                        <th>PHONE</th>
                        <th>MESSAGE</th>
                        <th>ACTION</th>
                    </tr>

                    {% for contact in contacts %}
                        <tr>
                            <td>{{ contact[0] }}</td>
                            <td>{{ contact[1] }}</td>
                            <td>{{ contact[2] }}</td>
                            <td>{{ contact[3] }}</td>
                            <td>{{ contact[4] }}</td>
                            <td>
                                <a href="/edit-contact/{{ contact[0] }}" class="btn btn-warning text-primary"><i class="bi bi-pencil"></i></a>
                                <form action="/delete/{{ contact[0] }}" method="POST" style="display:inline;">
                                    <button type="submit" class="btn btn-danger text-white"><i class="bi bi-trash"></i></button>
                                </form>
                            </td>
                        </tr>
                    {% endfor %}
                    
                </table>
            </div>
        </div>
    </div>

    

{% endblock %}
