{% extends './base.html' %} {% block title %}Edit Contact{% endblock %} {% block
content %}
<div class="container">
  <div class="row">
    <div class="col">
      <div class="container mt-5" style="margin-top: 100px !important">
        <img
          src="{{ url_for('static', filename='images/contact.jpg') }}"
          class="w-100 mt-5 rounded"
          alt=""
        />
      </div>
    </div>
    <div class="col">
      <div class="container mt-5">
        <h3 class="text-center">Edit Your Message</h3>
        <p class="text-center">Update What's you'r forgot.</p>

   

        <form action="/edit-contact/{{ contact[0] }}" method="POST">
          <div class="mb-3">
            <label for="full_name" class="form-label">Full Name</label>
            <input
              type="text"
              class="form-control"
              id="full_name"
              name="full_name"
              value = "{{ contact[1] }}"
            />
          </div>

          <div class="mb-3">
            <label for="emial" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" name="email" value = "{{ contact[2] }}" />
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone No.</label>
            <input type="text" class="form-control" id="phone" name="phone" value = "{{ contact[3] }}" />
          </div>

          <div class="mb-3">
            <label for="msg" class="form-label">Message </label>
            <textarea
              class="form-control"
              id="msg"
              rows="3"
              name="msg"
            >{{ contact[4] }}</textarea>
          </div>

          <button type="submit" class="btn btn-warning">Update</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
